name: freight-system

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: inzira-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kigali_freight
    ports:
      # Overridable because another project on the same machine may already
      # hold 5432. Production doesn't publish this at all (the prod overlay
      # resets ports), so this only affects local development.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d kigali_freight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inzira-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # Pinned to a specific release rather than :latest — a floating tag on
    # infra images means `docker compose pull` can silently change behavior
    # (or break) with no corresponding code change to review.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: inzira-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the delivery-photos bucket and exits. Deliberately
  # NOT made publicly readable (previously `mc anonymous set download`,
  # which meant anyone with a guessable/leaked key could read driver ID
  # documents and delivery photos with no auth at all) — the bucket stays
  # private, and config/r2Client.js now hands out short-lived signed URLs
  # instead of plain public links. MinIO itself doesn't auto-create
  # buckets on startup, hence this container.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: inzira-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env} &&
      mc mb --ignore-existing local/delivery-photos
      "

  router:
    build:
      context: .
      dockerfile: kigali-freight-router/Dockerfile
      # Stamps /health's commit field. Compose can't shell out, so these
      # come from the environment — use `deploy/build-router.sh` (or set
      # GIT_COMMIT yourself) rather than a bare `up -d --build`, which
      # leaves them empty and reports "unknown". Unknown is intentional
      # and harmless; a wrong SHA is not.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
    container_name: inzira-router
    command: sh -c "node bin/migrate.js && node --import ./instrument.js server.js"
    environment:
      NODE_ENV: development
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kigali_freight
      REDIS_URL: redis://redis:6379
      # No insecure fallback here on purpose — config/appConfig.js already
      # refuses to boot without a real JWT_SECRET; compose used to
      # undermine that by silently supplying a public, guessable default
      # ("dev-secret-change-in-production") whenever this wasn't set. The
      # `:?` form makes `docker compose up` fail immediately with a clear
      # message instead of starting with a forgeable secret.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, e.g. via `openssl rand -base64 48`}
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      # Bootstrapped as an admin account on first migration run (see
      # bin/migrate.js seedAdmin) since self-signup can no longer create
      # admin/dispatcher accounts. Both are optional — appConfig.js treats
      # them as "leave unset to skip seeding," so no insecure fallback is
      # needed here; an unset value is already the safe default.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Error reporting. Unset by default, which makes instrument.js a
      # no-op — local development and CI report nowhere.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Proof-of-delivery photo storage. Points at the local MinIO container
      # by default (S3-compatible, no real cloud account needed for dev) —
      # override R2_ENDPOINT/credentials to point at real Cloudflare R2 in
      # production instead.
      R2_ACCOUNT_ID: local-minio
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      R2_BUCKET_NAME: delivery-photos
      # Must be reachable from wherever the URL actually gets opened, not
      # just from this host — the web dashboard runs on this same machine
      # so "localhost" worked for it, but a photo URL saved with
      # "localhost" is meaningless on a physical phone (it'd resolve to the
      # phone itself). Same LAN IP the driver app's EXPO_PUBLIC_API_BASE_URL
      # already uses to reach this router. Set in .env, not hardcoded here,
      # since this is dev-machine-specific.
      R2_PUBLIC_URL_BASE: ${R2_PUBLIC_URL_BASE:?Set R2_PUBLIC_URL_BASE in .env, e.g. your LAN IP on port 9000 plus /delivery-photos}
      # Driver phone/OTP auth SMS delivery. Leave unset for local dev — the
      # OTP/invite code is logged by services/smsService.js instead of sent.
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      # MTN Mobile Money. Unset by default, which switches the feature off
      # entirely rather than half-on: payment requests are refused with a
      # message telling the driver to take cash, and no payout is attempted.
      MOMO_BASE_URL: ${MOMO_BASE_URL:-}
      MOMO_TARGET_ENVIRONMENT: ${MOMO_TARGET_ENVIRONMENT:-}
      MOMO_CURRENCY: ${MOMO_CURRENCY:-}
      MOMO_COLLECTION_SUBSCRIPTION_KEY: ${MOMO_COLLECTION_SUBSCRIPTION_KEY:-}
      MOMO_COLLECTION_API_USER: ${MOMO_COLLECTION_API_USER:-}
      MOMO_COLLECTION_API_KEY: ${MOMO_COLLECTION_API_KEY:-}
      MOMO_DISBURSEMENT_SUBSCRIPTION_KEY: ${MOMO_DISBURSEMENT_SUBSCRIPTION_KEY:-}
      MOMO_DISBURSEMENT_API_USER: ${MOMO_DISBURSEMENT_API_USER:-}
      MOMO_DISBURSEMENT_API_KEY: ${MOMO_DISBURSEMENT_API_KEY:-}
      MOMO_CALLBACK_BASE_URL: ${MOMO_CALLBACK_BASE_URL:-}
      DRIVER_PAYOUT_DELAY_MINUTES: ${DRIVER_PAYOUT_DELAY_MINUTES:-5}
      DRIVER_PAYOUT_TICK_MS: ${DRIVER_PAYOUT_TICK_MS:-60000}
      AT_DELIVERY_REPORT_SECRET: ${AT_DELIVERY_REPORT_SECRET:-}
      # One phone number whose sign-in code is a known constant instead of
      # a text message, so Apple's and Google's reviewers can actually get
      # into the app — sign-in is phone -> SMS code -> PIN, and a reviewer
      # on another continent never receives the text. Both must be set (the
      # code being exactly six digits) or the whole thing stays off, which
      # is the default everywhere including here. See
      # controllers/driverAuthController.js for what it does and, more
      # importantly, what it still enforces.
      APP_REVIEW_DEMO_PHONE: ${APP_REVIEW_DEMO_PHONE:-}
      APP_REVIEW_DEMO_OTP: ${APP_REVIEW_DEMO_OTP:-}
      # Push notifications (order-assigned, document approved/rejected).
      # Leave unset for local dev — config/firebaseAdmin.js treats a missing
      # path as "push disabled" rather than failing to boot.
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      # AI-assisted features (document review triage, more to follow).
      # Leave unset for local dev — config/anthropicClient.js treats a
      # missing key as "AI features disabled" rather than failing to boot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Encrypts TOTP MFA secrets at rest. Leave unset for local dev — the
      # MFA enroll endpoint returns a clear error rather than failing to
      # boot, since MFA is opt-in per account (see appConfig.js).
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Critical safety-incident alerts (geofence/speed violations) —
      # server.js's dispatchExternalAlert() tries ALERT_WEBHOOK_URL first,
      # falling back to Telegram when only that's set. Previously read by
      # config/appConfig.js but never actually passed through to this
      # container, so setting them in .env alone silently did nothing.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  ui:
    build:
      context: .
      dockerfile: kigali-freight-ui/Dockerfile
      # Build-time fallback only — a container started from this image
      # always overrides this at runtime via the API_BASE_URL env var
      # below (docker-entrypoint.sh generates /config.js from it), so the
      # same built image can be reused across environments without a
      # rebuild. This ARG only matters for a `vite build` run outside
      # Docker entirely.
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: inzira-ui
    environment:
      # The dashboard's own Sentry project, not the router's. The
      # entrypoint reads SENTRY_DSN inside this container, so the
      # distinct outer variable is what keeps browser events out of
      # the server project.
      SENTRY_DSN: ${SENTRY_DSN_DASHBOARD:-}
      GIT_COMMIT: ${GIT_COMMIT:-}
      SITE_URL: ${SITE_URL:-}
      PRE_LAUNCH: ${PRE_LAUNCH:-0}
      API_BASE_URL: http://localhost:5000
      # CARTO dark_all tiles. Injected into /config.js at start, not baked
      # into the image, so the same build works with or without a key.
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - router

volumes:
  postgres_data:
  redis_data:
  minio_data:
