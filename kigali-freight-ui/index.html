<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first (every current browser prefers it and it stays sharp at
         any tab size); the 32px PNG is the fallback for the ones that
         ignore SVG icons. Both are the driver app's launcher mark, so a
         pinned tab and the phone icon read as the same product. -->
    <!-- ?v= is a cache-buster, not decoration. Chrome keeps favicons in a
         store separate from the normal HTTP cache, and it survives a
         hard refresh — replacing the file at the same URL leaves existing
         visitors on the old icon indefinitely. Bump this whenever the
         icon artwork changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <!-- Outfit + DM Sans are the driver app's faces (see its theme.ts);
         the public site uses them so the customer-facing pages and the app
         a driver holds look like one product. display=swap so the hero
         renders in a fallback immediately rather than holding the page
         blank if fonts are slow or blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050C18" />
    <title>Inzira</title>
    <!-- Runtime config, generated by docker-entrypoint.sh at container
         start from the API_BASE_URL env var — lets one built image be
         deployed to multiple environments (staging/prod) without a
         rebuild. Missing entirely in local `npm run dev` (no container),
         which is fine: src/utils/api.js falls back to the Vite build-time
         env var in that case. Must load before the app bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
