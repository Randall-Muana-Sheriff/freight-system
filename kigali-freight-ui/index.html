<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first (every current browser prefers it and it stays sharp at
         any tab size); the 32px PNG is the fallback for the ones that
         ignore SVG icons. Both are the driver app's launcher mark, so a
         pinned tab and the phone icon read as the same product. -->
    <!-- ?v= is a cache-buster, not decoration. Chrome keeps favicons in a
         store separate from the normal HTTP cache, and it survives a
         hard refresh — replacing the file at the same URL leaves existing
         visitors on the old icon indefinitely. Bump this whenever the
         icon artwork changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <!-- Fonts are self-hosted (src/fonts.css) rather than linked from
         Google: this page's CSP is font-src 'self', so a fonts.gstatic.com
         face is blocked outright and the whole type system silently falls
         back. Archivo is carried on its width axis, not just weight — set
         wide and heavy it reads as transport signage. Plex Mono handles
         codes, coordinates and times. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050C18" />

    <!-- The description is what actually appears under the link in a
         search result, so it is written to be read by a person deciding
         whether to click, not stuffed with terms. -->
    <title>Inzira — freight across Kigali you can track</title>
    <meta name="description" content="Same-day and bulk freight across Kigali. Book in under a minute with no account, then follow your cargo from pickup to signature with a tracking code." />

    <!-- Link previews in WhatsApp are how most of this will actually be
         shared in Rwanda, so these matter more than the search tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inzira" />
    <meta property="og:title" content="Inzira — freight across Kigali you can track" />
    <meta property="og:description" content="Book a delivery in under a minute with no account, then follow your cargo from pickup to signature." />
    <meta property="og:image" content="/apple-touch-icon.png?v=5" />
    <meta name="twitter:card" content="summary" />

    <!-- Kigali is the whole service area, and a local-business record is
         what puts a company into map and "near me" results. Contact
         details are deliberately omitted rather than invented — add
         telephone and a real street address here once they are settled. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MovingCompany",
        "name": "Inzira",
        "description": "Freight and delivery across Kigali, with live tracking on every consignment.",
        "areaServed": { "@type": "City", "name": "Kigali", "addressCountry": "RW" },
        "address": { "@type": "PostalAddress", "addressLocality": "Kigali", "addressRegion": "Gikondo Industrial Zone", "addressCountry": "RW" }
      }
    </script>
    <!-- Runtime config, generated by docker-entrypoint.sh at container
         start from the API_BASE_URL env var — lets one built image be
         deployed to multiple environments (staging/prod) without a
         rebuild. Missing entirely in local `npm run dev` (no container),
         which is fine: src/utils/api.js falls back to the Vite build-time
         env var in that case. Must load before the app bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
