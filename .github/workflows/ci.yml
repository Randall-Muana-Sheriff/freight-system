name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # jsdom 30 (a vitest 4 transitive dependency, kigali-freight-ui) requires
  # Node ^22.22.2 || ^24.15.0 || >=26 — Node 20 crashes with "webidl.util.
  # markAsUncloneable is not a function" inside jsdom's bundled undici.
  # This only affects the CI runner's own Node (used to run test/lint/build
  # commands directly) — the production Docker images stay on node:20-alpine
  # since they only run `npm run build`/serve, which has no jsdom dependency.
  NODE_VERSION: '22'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test-ui:
    name: Tests (Web dashboard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kigali-freight-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kigali-freight-ui

      - name: Run tests
        run: npm run test
        working-directory: kigali-freight-ui

  test-driver-unit:
    name: Tests (Driver app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kigali-freight-driver/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kigali-freight-driver

      - name: Run tests
        run: npm run test
        working-directory: kigali-freight-driver

  # The router's unit tests had no job at all until now.
  #
  # ci.yml ran `npm run test` in kigali-freight-ui and kigali-freight-driver
  # and nowhere else, so the router's 92 tests gated nothing — including
  # money.test.js and orderTransitions.test.js, both written in response to
  # real bugs that reached production. They could go red on main with every
  # check still green. A test that cannot fail a build is a local courtesy,
  # not a gate.
  #
  # Deliberately separate from test-integration: these need no database, so
  # they still run and still block when Postgres or the integration env is
  # unavailable for any reason.
  test-router-unit:
    name: Tests (Router)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        working-directory: kigali-freight-router

  # Job id can't contain a colon — GitHub Actions job ids must match
  # ^[a-zA-Z_][a-zA-Z0-9_-]*$. The previous "test:integration" id made this
  # entire workflow file invalid, meaning NOTHING in it — lint, test,
  # build, security audits — actually ran on any push or PR.
  test-integration:
    name: Integration Tests (Router)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
          POSTGRES_DB: kigali_freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Shared by both steps below — config/appConfig.js requires DB_USER/
    # DB_PASSWORD/DB_HOST/DB_PORT/DB_DATABASE individually (there is no
    # DATABASE_URL support anywhere in this app); the previous version of
    # this job only ever set DATABASE_URL, which the app silently ignored,
    # so `npm run db:migrate` was failing here on "Missing required
    # environment variable: DB_USER" before the test step ever ran.
    # ADMIN_USERNAME/ADMIN_PASSWORD bootstrap the admin account
    # tests/integration.test.js logs in as (self-signup no longer exists).
    env:
      DB_USER: freight
      DB_PASSWORD: freight
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: kigali_freight
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-for-ci-only
      ADMIN_USERNAME: it_ci_admin
      ADMIN_PASSWORD: TestAdminPass123!
      METRICS_TOKEN: test-metrics-token-for-ci-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-ui, test-driver-unit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Build Docker images
        run: npm run docker:build

  security-audit:
    name: Security Audit (Router)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --workspace=kigali-freight-router --audit-level=high

      - name: Check for outdated packages
        run: npm outdated --workspace=kigali-freight-router || true

  test-driver:
    name: Driver App (TypeCheck + Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kigali-freight-driver/package-lock.json

      - name: Install driver dependencies
        run: npm ci
        working-directory: kigali-freight-driver

      - name: Run driver typecheck
        run: npm run typecheck
        working-directory: kigali-freight-driver

      - name: Run driver lint
        run: npm run lint
        working-directory: kigali-freight-driver

  security-audit-ui:
    name: Security Audit (UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kigali-freight-ui/package-lock.json

      - name: Audit UI dependencies
        run: npm audit --workspace=kigali-freight-ui --audit-level=high

  security-audit-driver:
    name: Security Audit (Driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: kigali-freight-driver/package-lock.json

      # Non-blocking: the one high-severity finding here is a uuid/xcode
      # vulnerability chain baked into Expo SDK 54's own toolchain
      # (@expo/config-plugins -> xcode -> uuid), with no fix available short
      # of a breaking Expo SDK major-version upgrade (54 -> 57). That upgrade
      # was evaluated and deliberately deferred as a separate, larger effort
      # requiring a full native rebuild-and-test cycle — see docs/adr/ and
      # the implementation report. This step still runs and reports on every
      # push so a NEW vulnerability (not this known one) is visible in the
      # logs; it just doesn't block merges over an already-tracked issue.
      - name: Audit driver dependencies
        run: npm audit --workspace=kigali-freight-driver --audit-level=high
        continue-on-error: true

  # Deploy to staging on develop branch. This step is intentionally a
  # placeholder, not a fake success — there is currently no real staging
  # host or deploy credentials configured anywhere in this repo. See
  # docs/deployment/ for the real, activatable deploy scaffolding (SSH +
  # docker-compose.staging.yml) and what's needed to turn this from a echo
  # into a real deployment.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build, test-router-unit, test-integration, security-audit, test-driver, security-audit-ui, security-audit-driver]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging (placeholder — see docs/deployment/README.md)
        run: echo "No staging host configured yet. See docs/deployment/README.md to activate this step."

  # Deploy to production on main branch. Only runs after every check above
  # (including both security-audit jobs and the driver app's own
  # typecheck/lint) has passed on main itself, never on a PR. Requires one
  # repo secret: PRODUCTION_SSH_KEY (the private half of a key whose public
  # half is already in freightadmin@api.inzira.systems's authorized_keys —
  # see docs/deployment/README.md for how that host was set up). Host and
  # user aren't secrets — they're not exploitable without the key — so
  # they're plain values below rather than extra secrets to configure.
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, test-router-unit, test-integration, security-audit, test-driver, security-audit-ui, security-audit-driver]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      PRODUCTION_HOST: api.inzira.systems
      PRODUCTION_USER: freightadmin
      PRODUCTION_PATH: freight-system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      # Excludes the driver app entirely — neither the router nor the UI
      # Docker build ever reads from it (see their Dockerfiles: only root
      # package.json/package-lock.json, packages/, and their own directory
      # are COPYed in), so shipping it here would just be dead weight.
      # --delete keeps the server's checkout from drifting from the repo
      # over time, but never touches anything matched by --exclude — so
      # .env/.env.production/secrets/ (all server-only, never in git) are
      # both skipped AND protected from deletion, not just skipped.
      - name: Sync repository to production host
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='kigali-freight-driver' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='.env.local' \
            --exclude='secrets/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_PATH/"

      - name: Build and restart affected services
        run: |
          ssh -i ~/.ssh/deploy_key "$PRODUCTION_USER@$PRODUCTION_HOST" "
            cd $PRODUCTION_PATH &&
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml build router ui &&
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d router ui
          "

      - name: Verify the deployed router is healthy
        run: |
          sleep 5
          curl -sf "https://$PRODUCTION_HOST/health" || (echo "::error::Health check failed after deploy" && exit 1)
