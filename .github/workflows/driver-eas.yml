name: Driver App - EAS

# Separate from ci.yml on purpose: this needs its own `paths` filter (only
# run when the driver app or a shared package actually changed), and
# GitHub Actions applies `paths` to a whole workflow's trigger, not
# per-job — folding this into ci.yml would mean adding it there gates
# every other job in that file on the same filter too.

on:
  push:
    branches: [main]
    paths:
      - 'kigali-freight-driver/**'
      - 'packages/**'
  # Manual native build — every OTA-eligible push below publishes
  # automatically, but cutting a new native build (a new store submission,
  # a new native module) stays a deliberate human action triggered from
  # the Actions tab, not something a plain git push should do on its own.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: 'eas.json build profile'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  verify:
    name: Typecheck + Lint (Driver app)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: kigali-freight-driver
        run: npm run typecheck

      - name: Lint
        working-directory: kigali-freight-driver
        run: npm run lint

      - name: Test
        working-directory: kigali-freight-driver
        run: npm run test

  publish-update:
    name: Publish OTA Update
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Publishes to the "preview" branch/environment — the same one this
      # whole system has been manually publishing to. Update this (and the
      # matching build profile below) once a real separate production
      # release actually exists; see eas.json's three build profiles.
      - name: Publish update
        working-directory: kigali-freight-driver
        run: |
          eas update --branch preview --environment preview --non-interactive \
            --message "${{ github.event.head_commit.message }}"

  native-build:
    name: Trigger Native Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: queues the build on Expo's servers and returns
      # immediately rather than tying up a GitHub Actions runner for the
      # ~15 minutes a cloud build takes. Progress/download link show up on
      # the EAS dashboard and via `eas build:list`, same as every build
      # run manually from a local machine this session.
      - name: Trigger build
        working-directory: kigali-freight-driver
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --non-interactive --no-wait
