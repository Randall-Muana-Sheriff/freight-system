# Production overlay — use together with the base file, never alone:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes relative to local dev:
#   - Adds Caddy in front of router+ui for automatic HTTPS (see deploy/Caddyfile).
#   - Stops publishing postgres/redis/router/ui ports directly to the host —
#     on a real internet-facing machine, only Caddy's 80/443 should be
#     reachable from outside; everything else talks over the compose
#     network only. Locally these were fine to expose for convenience
#     (`psql` from the host, hitting the API directly); in production
#     they're an unnecessary open door.
#   - Sets NODE_ENV=production on the router, which activates the safe-
#     error-message behavior in utils/httpResponse.js (raw internal error
#     detail is only ever included in non-production responses).
#
# What this deliberately does NOT do: choose a secrets manager for you, or
# stand up a real host. See docs/deployment/README.md for both.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  router:
    ports: !reset []
    # The base file makes minio-init a hard dependency (needed in dev so
    # the bucket exists before the router starts). In production, without
    # this override, `docker compose up postgres redis router ui caddy`
    # silently pulls in minio + minio-init anyway as router's transitive
    # dependencies — including publishing MinIO's ports (9000-9001)
    # straight to the internet, which is exactly the kind of unnecessary
    # open door this overlay exists to close. Overriding the full
    # dependency map removes minio-init entirely.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The base file hardcodes this as a literal (not a ${VAR}
      # interpolation at all), so there was no way to override it via any
      # env file — the router silently kept rejecting every browser
      # request from the real production dashboard's origin with CORS
      # errors, even though direct API calls (curl, which doesn't enforce
      # CORS) worked fine. Required in production: a wrong or missing
      # value here should fail the deploy loudly, not silently fall back
      # to an origin no real browser will ever be making requests from.
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production to your real https://dispatch.yourcompany.com}
      # The base file aliases these to the local MinIO container's own
      # credentials — fine for dev (MinIO stands in for R2 there), but it
      # meant this override was required to actually reach real Cloudflare
      # R2 in production, which never existed until now. Overriding the
      # full set of keys here (Compose merges environment maps per-key)
      # replaces the MinIO aliasing entirely. Left unset in .env.production,
      # these resolve to empty strings, which config/r2Client.js's
      # isConfigured() correctly treats as "not configured" — the router
      # starts fine and just disables photo/document upload with a log
      # warning, rather than requiring a real R2 account before anything
      # else can go live.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL_BASE: ${R2_PUBLIC_URL_BASE:-}

  ui:
    ports: !reset []
    environment:
      # Must be the real public HTTPS URL Caddy terminates — not
      # localhost, and not the router's internal compose hostname (a
      # browser/phone can't resolve "router", only Caddy's public domain).
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env.production to your real https://api.yourcompany.com}

  caddy:
    image: caddy:2.8-alpine
    container_name: kigali-freight-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production (e.g. api.yourcompany.com)}
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production (e.g. dispatch.yourcompany.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - router
      - ui

volumes:
  caddy_data:
  caddy_config:
